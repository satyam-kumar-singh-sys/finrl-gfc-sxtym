# ===========================================================================
# THE AUTOPILOT
# ===========================================================================
# This file is what makes the strategy run by itself. GitHub reads it and, on
# the schedule below, spins up a small temporary computer (a "runner"), runs the
# bot once, then shuts it down. Nothing needs to be switched on at home; your
# laptop can be closed.
#
# Two runs each US trading day:
#   14:45 UTC = 09:45 New York → work out today's targets and rebalance
#   21:15 UTC = 16:15 New York → just record the closing account value
# (New York is 5 hours behind UTC in winter, 4 in summer, so 09:45 UTC-based is
#  09:45 EST in winter and 10:45 EDT in summer — both safely after the open.)
#
# After each run it COMMITS the logs back into the repository. That is how the
# trade log and equity curve stay public and auditable — one of the competition's
# stated requirements. This is also why the workflow needs "contents: write".
#
# IMPORTANT: the two secrets APCA_API_KEY / APCA_API_SECRET must exist in
# Settings → Secrets and variables → Actions. They are never written in this
# file, and never stored in the repository.
# ===========================================================================
name: live-paper-trading

on:
  schedule:
    - cron: "45 14 * * 1-5"   # 1-5 = Monday to Friday; 09:45 New York: trade
    - cron: "15 21 * * 1-5"   # 16:15 New York: record the closing balance
  workflow_dispatch:            # also allow a manual "Run workflow" button
    inputs:
      dry_run:
        description: "Only plan orders (no trades placed)"
        type: boolean
        default: false
      snapshot:
        description: "Record end-of-day equity only"
        type: boolean
        default: false

# Never let two runs overlap — two rebalances at the same moment would fight
# over the same cash and could double-trade.
concurrency:
  group: ata-trading
  cancel-in-progress: false

permissions:
  contents: write               # required to commit logs back to the repo
  issues: write                 # required to open an alert issue on failure

jobs:
  trade:
    runs-on: ubuntu-24.04   # pinned: a surprise OS upgrade cannot change results
    timeout-minutes: 20         # kill a stuck run rather than burn minutes
    env:
      # The two secrets are injected here as environment variables. The Python
      # code reads them by these names (see src/config/settings.py).
      APCA_API_KEY: ${{ secrets.APCA_API_KEY }}
      APCA_API_SECRET: ${{ secrets.APCA_API_SECRET }}
      # Hard-coded to the paper (pretend-money) server on purpose: even if a
      # real key were added by mistake, the bot could not trade real money.
      APCA_BASE_URL: https://paper-api.alpaca.markets
      APCA_USE_PAPER_TRADING: "true"
      DRIFT_BAND: "0.02"        # ignore moves smaller than 2% of the account
      MIN_ORDER_NOTIONAL: "25"  # ignore orders below $25
      PYTHONUNBUFFERED: "1"     # show log lines immediately, not at the end
      # --- operational safety, set as repository VARIABLES (not secrets) ---
      # TRADING_PAUSED=true  -> keep computing and logging, send no orders.
      #                          This is the emergency brake: no code change,
      #                          no gap in the audit trail. Delete the variable
      #                          (or set it to false) to resume.
      # APCA_EXPECTED_ACCOUNT_ID=PA3XXXXXXX
      #                       -> pin the account. If the broker reports a
      #                          different account number the run refuses to
      #                          trade, which catches a rotated/wrong API key
      #                          before it writes to someone else's account.
      TRADING_PAUSED: ${{ vars.TRADING_PAUSED }}
      APCA_EXPECTED_ACCOUNT_ID: ${{ vars.APCA_EXPECTED_ACCOUNT_ID }}
    steps:
      # 1. Download this repository onto the temporary machine.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Install Python 3.11 and cache the downloads for speed.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install the handful of libraries the bot needs.
      - name: Install dependencies
        run: pip install -q -r requirements-live.txt

      # 4. Run the automatic checks first. If a test fails the job stops here,
      #    so a broken build can never place an order.
      - name: Pre-flight checks
        run: python -m pytest -q tests

      # 4b. Print the guard report (kill switch, code fingerprint) before the
      #     bot touches the account. Cheap, and it makes the safety state
      #     visible in the run log even when everything is fine.
      - name: Guard report
        run: python -m scripts.guards

      # 5. The morning run: decide, compare with the account, rebalance.
      - name: Generate signal, rebalance paper account
        if: github.event.schedule != '15 21 * * 1-5' && inputs.snapshot != true
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scripts.run_daily --dry-run
          else
            python -m scripts.run_daily
          fi

      # 6. The evening run: record the closing balance for the equity curve.
      - name: End-of-day equity snapshot
        if: github.event.schedule == '15 21 * * 1-5' || inputs.snapshot == true
        run: python -m scripts.run_daily --snapshot

      # 7. Save the audit trail (logs/ and results/) back into the repository,
      #    so anyone — including the judges — can read every decision.
      - name: Publish audit trail
        run: |
          git config user.name  "ata-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs results
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "logs: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      # 8. Print which server was used, as a visible safety confirmation.
      - name: Account endpoint used
        if: always()
        run: echo "trading against $APCA_BASE_URL (must contain 'paper')"

# ---------------------------------------------------------------------------
# ALERTS
# ---------------------------------------------------------------------------
# If the trading job fails, open an issue. This is the notification path that
# actually works on every GitHub plan: watch "Issues" (Watch → Custom → Issues)
# and GitHub emails you; or install the GitHub mobile app for a push.
#
# Why not "Watch → Actions"? Some GitHub versions no longer offer that checkbox
# in the Watch dialog (yours does not), and per-workflow failure emails are
# configured globally under Settings → Notifications → Actions. An issue is
# explicit, permanent, and visible in the repository itself — better evidence
# for the competition, too.
#
# `if: failure()` means this job ONLY runs when the trading job broke. On a
# healthy day nothing here executes.
  alert:
    needs: trade
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      # One issue per *incident*, not one per failure. A week-long outage would
      # otherwise open five near-identical issues and a week of nagging, which is
      # how people learn to ignore alerts. Closing the issue is the
      # acknowledgement; if it fails again afterwards, a new issue opens.
      - name: Open (or update) an issue describing the failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bot-alert --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Automated trading/health alert" 2>/dev/null || true
          BODY="The paper-trading workflow failed on $(date -u +%Y-%m-%dT%H:%MZ).

          Run log: $RUN_URL

          What to do: RUNBOOK.md §8 lists the usual causes and fixes. Re-run the job
          after fixing. A missed session is not fatal for a trend strategy; a silent
          week is. **Close this issue when you have read it** — closing is the
          acknowledgement, and a new failure after that opens a fresh issue."
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --label bot-alert --search "Trading run failed in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "already alerted in issue #$OPEN — adding a comment instead of a new issue"
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Trading run failed $(date -u +%Y-%m-%d)" \
              --label bot-alert --body "$BODY"
          fi
