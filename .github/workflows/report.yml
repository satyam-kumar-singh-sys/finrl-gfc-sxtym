# ===========================================================================
# THE DAILY REPORT
# ===========================================================================
# The trading workflow writes numbers. This one turns them into something a
# human can read, once per session, and commits the result:
#
#     results/live_summary.md   a short plain-text scoreboard (open it on GitHub)
#     results/live_metrics.json the same numbers, machine-readable
#     figs/live_equity.png      the equity curve chart vs the S&P 500
#
# It runs ~30 minutes after the closing snapshot, Monday to Friday, so by the
# evening there is always a fresh report sitting in the repository. No email, no
# laptop, no action required.
#
# It needs no Alpaca keys: it reads results/daily_equity.csv, which the trading
# workflow already committed. That also means the report can never disagree with
# the recorded trade history.
# ===========================================================================
name: daily-report

on:
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC = 17:45 New York, after the close
    - cron: "15 22 * * 1-5"   # retry: GitHub sometimes drops scheduled runs
  workflow_dispatch:           # also runnable by hand

concurrency:
  group: ata-report
  cancel-in-progress: false

permissions:
  contents: write              # commit the report back
  issues: write                # open an issue when a health check fails

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Read-only history straight from the broker, used only if the committed
      # daily_equity.csv is missing (e.g. the very first day).
      APCA_API_KEY: ${{ secrets.APCA_API_KEY }}
      APCA_API_SECRET: ${{ secrets.APCA_API_SECRET }}
      APCA_BASE_URL: https://paper-api.alpaca.markets
      APCA_USE_PAPER_TRADING: "true"
      PYTHONUNBUFFERED: "1"
      # Same kill switch as the trading workflow. The report only uses it to
      # show a truthful PAUSED badge; it never places orders.
      TRADING_PAUSED: ${{ vars.TRADING_PAUSED }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements-live.txt

      # Build the report from the committed equity log. This step is allowed to
      # fail harmlessly (e.g. only one day of data so far) without breaking the
      # workflow, so the repository never ends up in a red state for "not enough
      # history yet".
      - name: Build report
        run: python -m scripts.report || echo "not enough history yet — will retry tomorrow"

      # Health checks: fresh data, run cadence, drawdown budget, trading
      # activity, signal sanity. `|| true` on purpose — a failing check must
      # still publish the report and the dashboard; the failure is visible in
      # results/health.md and raises an issue in the next step.
      - name: Health checks
        run: python -m scripts.monitor --quiet || true

      # Rebuild the single-file public dashboard served by GitHub Pages.
      - name: Build dashboard
        run: python -m scripts.dashboard

      # Raise a health alert as a GitHub issue, because an issue is an email, a
      # phone push and permanent evidence that the problem was seen.
      #
      # Two refinements learned the hard way elsewhere:
      #   * ONE issue per incident. A recurring failure comments on the open
      #     issue instead of opening a new one every evening — a week of nagging
      #     is how alerts get ignored.
      #   * The body says what to DO, not just that something is wrong.
      # Closing the issue is the acknowledgement; a later failure reopens a new one.
      - name: Raise (or update) an issue when unhealthy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python -m scripts.monitor --quiet; then
            echo "healthy — no issue raised"
            exit 0
          fi
          gh label create bot-alert --color B60205 \
            --description "Automated trading/health alert" 2>/dev/null || true
          # Build the alert body in /tmp: results/health.md is committed to the
          # repository, and it must stay a clean record of the checks.
          cp results/health.md /tmp/alert_body.md
          {
            echo ""
            echo "---"
            echo "Detected $(date -u +%Y-%m-%dT%H:%MZ). Full check list in \`results/health.md\`."
            echo ""
            echo "**What to do:** open RUNBOOK.md §8, match the failing check, follow the fix."
            echo "The usual three: a missed cron run (re-run the job), stale Yahoo data"
            echo "(re-run), or a real drawdown past the risk budget (do nothing — the"
            echo "strategy's rules are the entry; a bad week is not a bug)."
            echo ""
            echo "**Close this issue when you have read it** — closing is the"
            echo "acknowledgement, and a new failure afterwards opens a fresh issue."
          } >> /tmp/alert_body.md
          OPEN=$(gh issue list --state open --label bot-alert \
                   --search "health check failed in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            echo "already alerted in issue #$OPEN — commenting instead of duplicating"
            gh issue comment "$OPEN" --body-file /tmp/alert_body.md
          else
            gh issue create \
              --title "Bot health check failed $(date -u +%Y-%m-%d)" \
              --label bot-alert --body-file /tmp/alert_body.md
          fi

      - name: Publish report
        run: |
          git config user.name  "ata-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results figs docs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "report: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
